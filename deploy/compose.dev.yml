# JokkoRM — stack de développement locale.
#
# Démarre : Postgres 16 (DB jokkorm), Keycloak 26 (admin/admin), Mailpit (SMTP sandbox).
# Ports choisis hors range JokkoFile pour permettre les deux stacks en parallèle.
#
#   make dev        → lance la stack
#   make dev-down   → arrête

services:
  postgres:
    image: postgres:16-alpine
    container_name: jokkorm-postgres
    environment:
      POSTGRES_DB: jokkorm
      POSTGRES_USER: jokkorm
      POSTGRES_PASSWORD: jokkorm
    ports:
      - "5490:5432"
    volumes:
      - jokkorm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jokkorm -d jokkorm"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: jokkorm-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8085:8080"
    volumes:
      # Phase 3C — importe le realm `jokkorm` au premier boot. Contient les rôles RM_*,
      # les clients jokkorm-web (public) et jokkorm-master-webhook (M2M), le mapper
      # custom `tenant`, et 2 users démo (admin / operator / password `JokkoRM2026!`).
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: jokkorm-mailpit
    ports:
      - "8025:8025"   # UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  jokkorm-pgdata:
