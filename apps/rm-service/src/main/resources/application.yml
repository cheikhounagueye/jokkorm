server:
  # Port 8091 et pas 8090 : l'auteur initial avait un ancien container
  # glpi-senum HAProxy qui occupait déjà 8090 côté hôte (changement 2026-11-22).
  port: 8091
  shutdown: graceful
  error:
    include-message: always

spring:
  application:
    name: jokkorm-rm-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  datasource:
    url: ${JOKKORM_DB_URL:jdbc:postgresql://localhost:5490/jokkorm}
    username: ${JOKKORM_DB_USER:jokkorm}
    password: ${JOKKORM_DB_PASSWORD:jokkorm}
    hikari:
      maximum-pool-size: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          # Realm `jokkorm` importé au boot Keycloak depuis
          # deploy/keycloak/realms/jokkorm-realm.json (compose.dev.yml).
          issuer-uri: ${JOKKORM_OIDC_ISSUER:http://localhost:8085/realms/jokkorm}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.jokkorm: INFO
    org.springframework.security: INFO

jokkorm:
  # Which SAE master this instance is paired with.
  # See RoutingSaeMasterPort : un maître par tenant, défaut = kind.
  # See docs/adr/0003-sae-master-port.md.
  master:
    # Maître par défaut des tenants : noop (autonome), demo, maarch (Courrier), maarchrm.
    kind: ${JOKKORM_MASTER_KIND:noop}
    # Maître par tenant (map jokkorm.master.tenants.<tenant>), en env :
    # JOKKORM_MASTER_TENANTS_ACME=maarchrm. Un seul maître par tenant, pas de repli.
    # Maarch RM 2.x (API JSON laabs). Le connecteur n'existe que si l'URL est renseignée.
    maarchrm:
      base-url: ${JOKKORM_MAARCHRM_BASE_URL:}
      service-client-token: ${JOKKORM_MAARCHRM_SERVICE_CLIENT_TOKEN:service}
      auth-mode: ${JOKKORM_MAARCHRM_AUTH_MODE:basic}
      login: ${JOKKORM_MAARCHRM_LOGIN:}
      password: ${JOKKORM_MAARCHRM_PASSWORD:}
      service-token: ${JOKKORM_MAARCHRM_SERVICE_TOKEN:}
      timeout-ms: ${JOKKORM_MAARCHRM_TIMEOUT_MS:10000}
      # Champ de description Maarch qui affiche l'état physique (à créer dans Maarch et à
      # ajouter, non immuable, aux profils d'archivage utilisés).
      location-field: ${JOKKORM_MAARCHRM_LOCATION_FIELD:localisation_physique}
      # URL de Maarch vue par les navigateurs des agents (bouton « Ouvrir dans Maarch RM »).
      # Vide = base-url. À préciser si JokkoRM joint Maarch par une adresse interne.
      public-url: ${JOKKORM_MAARCHRM_PUBLIC_URL:}
      # Compte Maarch de JokkoRM, pour reconnaître ses propres écritures dans le journal.
      # Vide = le login (mode basic) ou « jokkorm » (mode compte de service).
      connector-account: ${JOKKORM_MAARCHRM_CONNECTOR_ACCOUNT:}
    # File d'envoi de l'état physique vers le maître (tranche 2a).
    sync:
      worker-enabled: ${JOKKORM_MASTER_SYNC_WORKER_ENABLED:true}
      delay-ms: ${JOKKORM_MASTER_SYNC_DELAY_MS:5000}
    # Veilleur du journal du maître (étape 1) : gel, emplacement modifié à la main.
    watch:
      enabled: ${JOKKORM_MASTER_WATCH_ENABLED:true}
      delay-ms: ${JOKKORM_MASTER_WATCH_DELAY_MS:60000}
      # Premier démarrage : relire la dernière journée du journal (rien n'est rejoué deux fois).
      initial-lookback-hours: ${JOKKORM_MASTER_WATCH_INITIAL_LOOKBACK_HOURS:24}
    # Copie locale en lecture seule des données de rangement (D3 : service, sort final, échéance,
    # classification). Relue quand elle manque ou dépasse max-age (format ISO-8601, P1D = un jour).
    snapshot:
      worker-enabled: ${JOKKORM_MASTER_SNAPSHOT_WORKER_ENABLED:true}
      delay-ms: ${JOKKORM_MASTER_SNAPSHOT_DELAY_MS:300000}
      max-age: ${JOKKORM_MASTER_SNAPSHOT_MAX_AGE:P1D}
      batch: ${JOKKORM_MASTER_SNAPSHOT_BATCH:50}
  physical:
    # Pattern 10 : longueur de tablette par défaut et marge de manipulation (validés 2026-11-23).
    default-tablette-length-mm: ${JOKKORM_DEFAULT_TABLETTE_LENGTH_MM:1000}
    handling-margin-percent: ${JOKKORM_HANDLING_MARGIN_PERCENT:5}
  dev:
    # Endpoints /api/v1/dev/* (données de démo). Jamais en prod.
    seeding-enabled: ${JOKKORM_DEV_SEEDING_ENABLED:false}
