databaseChangeLog:
  - changeSet:
      id: 0011-access-request
      author: jokkorm
      comment: >
        Phase 5P — workflow 4-eyes des demandes utilisateurs (pattern 07).
        Remplace progressivement physical_loan pour les BORROW_BOX. Pour les
        EXTRACT_PIECES et DIGITIZE_EXTRACT, c'est le seul agrégat.
      changes:
        - createTable:
            tableName: access_request
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column:
                  name: tenant_id
                  type: VARCHAR(64)
                  constraints: { nullable: false, foreignKeyName: fk_access_request_tenant, references: tenant(id) }
              - column: { name: request_type, type: VARCHAR(32), constraints: { nullable: false } }
              - column:
                  name: container_id
                  type: UUID
                  constraints: { nullable: false, foreignKeyName: fk_access_request_container, references: physical_container(id) }
              - column: { name: status, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: requester_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: requester_name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: requester_dept, type: VARCHAR(255) }
              - column: { name: purpose, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: pieces_description, type: TEXT }
              - column: { name: expected_return_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: qualified_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: qualified_by, type: VARCHAR(255) }
              - column: { name: qualification_notes, type: TEXT }
              - column: { name: approved_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: approved_by, type: VARCHAR(255) }
              - column: { name: approval_notes, type: TEXT }
              - column: { name: fulfilled_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: fulfilled_by, type: VARCHAR(255) }
              - column: { name: fulfillment_notes, type: TEXT }
              - column: { name: completed_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: maarch_res_id, type: VARCHAR(128) }
              - column: { name: maarch_url, type: VARCHAR(1024) }
              - column: { name: rejected_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: rejected_by, type: VARCHAR(255) }
              - column: { name: reject_reason, type: VARCHAR(500) }
              - column: { name: cancelled_at, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: cancel_reason, type: VARCHAR(500) }
              - column:
                  name: physical_loan_id
                  type: UUID
                  constraints: { foreignKeyName: fk_access_request_loan, references: physical_loan(id) }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - createIndex:
            tableName: access_request
            indexName: ix_access_request_tenant_status
            columns:
              - column: { name: tenant_id }
              - column: { name: status }
        - createIndex:
            tableName: access_request
            indexName: ix_access_request_tenant_requester
            columns:
              - column: { name: tenant_id }
              - column: { name: requester_id }
        - createIndex:
            tableName: access_request
            indexName: ix_access_request_tenant_container
            columns:
              - column: { name: tenant_id }
              - column: { name: container_id }
