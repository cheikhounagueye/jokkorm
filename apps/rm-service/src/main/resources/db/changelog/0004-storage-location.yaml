databaseChangeLog:
  - changeSet:
      id: 0004-storage-location
      author: jokkorm
      comment: >
        Phase 5A — topographie physique en table unique polymorphique.
        Hiérarchie fixe SITE → STOREHOUSE → SHELF → RACK → POSITION (enum kind).
        Chaque niveau a un code unique parmi ses frères (contrainte via index partiel).
        path dénormalisé = concaténation des codes depuis la racine.
      changes:
        - createTable:
            tableName: storage_location
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_storage_location_tenant
                    references: tenant(id)
              - column:
                  name: kind
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: VARCHAR(255)
              - column:
                  name: parent_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_storage_location_parent
                    references: storage_location(id)
              - column:
                  name: path
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: storage_location
            columnNames: tenant_id, path
            constraintName: uq_storage_location_tenant_path
        - createIndex:
            tableName: storage_location
            indexName: ix_storage_location_tenant_parent
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: parent_id
        - createIndex:
            tableName: storage_location
            indexName: ix_storage_location_tenant_kind
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: kind
        - sql:
            comment: >
              Index partiel d'unicité pour les racines (parent_id null) — SQL brut
              car Liquibase addUniqueConstraint ne supporte pas WHERE sous Postgres.
            sql: >
              CREATE UNIQUE INDEX uq_storage_location_root_code
              ON storage_location (tenant_id, code)
              WHERE parent_id IS NULL;
