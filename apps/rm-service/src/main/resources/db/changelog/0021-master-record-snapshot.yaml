databaseChangeLog:
  - changeSet:
      id: 0021-master-record-snapshot
      author: jokkorm
      comment: >
        Étude du 24 novembre 2026, D3 : copie locale EN LECTURE SEULE de ce que le maître sait d'un
        dossier et qui sert à le ranger (service producteur, sort final, échéance, classification,
        gel). Le maître reste le seul propriétaire (pattern 03) : la copie est remplie à l'import,
        rafraîchie par le veilleur et par une relecture périodique, jamais modifiée à la main.
        Jamais le titre ni la description (données personnelles) : lus en direct chez le maître.
        Une ligne par dossier ; fetched_at dit de quand date la copie.
      changes:
        - createTable:
            tableName: master_record_snapshot
            columns:
              - column:
                  name: record_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_master_record_snapshot
                    nullable: false
                    foreignKeyName: fk_master_record_snapshot_record
                    references: physical_archive_record(id)
                    deleteCascade: true
              - column:
                  name: tenant_id
                  type: VARCHAR(64)
                  constraints: { nullable: false, foreignKeyName: fk_master_record_snapshot_tenant, references: tenant(id) }
              - column: { name: master_kind, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: service_code, type: VARCHAR(128) }
              - column: { name: final_fate, type: VARCHAR(32) }
              - column: { name: final_fate_source, type: VARCHAR(64) }
              - column: { name: disposal_date, type: DATE }
              - column: { name: classification_level, type: VARCHAR(128) }
              - column: { name: legal_hold, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: fetched_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - createIndex:
            tableName: master_record_snapshot
            indexName: ix_master_record_snapshot_fetched
            columns:
              - column: { name: tenant_id }
              - column: { name: fetched_at }
